<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>What We Left Behind</title>
  <meta name="description" content="An interactive bilingual (English / Arabic) storybook about NASA's Opportunity rover, for young learners.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img class="logo" src="" alt="" aria-hidden="true"><span id="brandName">What We <b>Left Behind</b></span></div>
    <div class="tools">
      <button id="btnLang" class="tool lang-btn"></button>
      <button id="btnAuto" class="tool" aria-pressed="false"></button>
      <button id="btnSpeed" class="tool"></button>
      <button id="btnSize" class="tool"></button>
      <button id="btnSfx" class="tool" aria-pressed="true"></button>
      <button id="btnMusic" class="tool" aria-pressed="true"></button>
      <button id="btnFull" class="tool"></button>
    </div>
  </header>

  <main class="desk">
    <div class="book closed" id="book">
      <div class="spread" id="spread">
        <!-- two A4 pages; each one is filled by app.js with an illustration + its text -->
        <section class="page slot" id="slotA" data-slot="A"></section>
        <section class="page slot" id="slotB" data-slot="B"></section>
        <div class="gutter" aria-hidden="true"></div>
        <div class="ribbon" aria-hidden="true"></div>

        <!-- hardcover: the team's cover picture, with the inside of the cover on its back -->
        <div class="cover" id="cover">
          <div class="face cover-front" id="coverFront">
            <!-- the team's full cover picture (1024x1280), filling the whole cover; a few stars twinkle and one shoots past on top -->
            <img class="cover-img cover-full" id="coverArt" src="images/cover-new.jpg" alt="" draggable="false">
            <div class="cover-top cover-sky" aria-hidden="true">
              <span class="tw" style="left:30%;top:6%;--d:0s"></span><span class="tw big" style="left:52%;top:3%;--d:1.1s"></span>
              <span class="tw" style="left:86%;top:38%;--d:.5s"></span><span class="tw" style="left:8%;top:40%;--d:1.8s"></span>
              <span class="shoot"></span>
            </div>
            <h2 class="sr-only" id="coverTitle"></h2>
            <button class="open-btn" id="btnOpen"></button>
          </div>
          <div class="face cover-back page" id="coverBack"></div>
        </div>
      </div>
    </div>
  </main>

  <nav class="pager">
    <button id="prev" class="nav-btn"></button>
    <div class="dots" id="dots"></div>
    <button id="next" class="nav-btn"></button>
  </nav>

  <div id="toast" class="toast" role="status"></div>

  <script src="js/story.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/flat.js"></script>
  <script src="js/flat-objects.js"></script>
  <script src="js/bg2.js"></script>
  <script src="js/art.js"></script>
  <script src="js/scenes.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
